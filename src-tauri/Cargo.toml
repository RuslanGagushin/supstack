[package]
name = "supstack"
version = "0.34.0"
license = "MIT"
description = "Supstack — notebooks and an Org-style agenda for folders of Markdown notes"
edition = "2021"
publish = false

[lib]
name = "supstack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-vault = { path = "../tauri-plugin-vault" }
# reminders for tasks with a time (spec TASK-1): scheduled ahead on Android, sent by the page on desktop
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# self-update from GitHub Releases; Android installs updates as a new APK instead
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# the shortcut that brings up quick capture from anywhere (spec TASK-5)
tauri-plugin-global-shortcut = "2.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
