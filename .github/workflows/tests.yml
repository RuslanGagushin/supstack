# Runs the tests on every push and pull request:
#  - checks: ESLint over the page's code, scripts and tests, and the type check of web/src/js/core/
#  - page: tests/*.test.mjs, the real page in headless Chrome (ubuntu-latest has Chrome; playwright-core drives it, nothing is downloaded)
#  - plugin: rustfmt over the Rust crates (rustfmt.toml), clippy over tauri-plugin-vault with warnings as errors,
#    and cargo test for it (desktop file access, git sync)
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri's Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: tauri-plugin-vault -> target
      - run: cargo fmt --manifest-path tauri-plugin-vault/Cargo.toml --check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path tauri-plugin-vault/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tauri-plugin-vault/Cargo.toml
